# Overlay для NVIDIA GPU (live ML в ingest без 504).
# Запуск:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.gpu.yml up --build -d
# или: scripts/start_stack.ps1 -Gpu

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTORCH_VARIANT: gpu
    environment:
      GYMNET_DISABLE_LIVE_ML: "false"
      GYMNET_LIVE_ML_INTERVAL_SEC: "0.5"
      GYMNET_LIVE_ML_TIMEOUT_SEC: "4"
      GYMNET_INGEST_HTTP_TIMEOUT_SEC: "15"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all

  # Дообучение на CPU, чтобы не делить VRAM с live ML в backend.
  ml-autotrain:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.pipeline.txt
    environment:
      CUDA_VISIBLE_DEVICES: ""
      GYMNET_TRAIN_DEVICE: cpu

  ml-pipeline:
    gpus: all
