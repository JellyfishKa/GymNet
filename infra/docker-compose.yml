services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymnet
      POSTGRES_PASSWORD: gymnet
      POSTGRES_DB: gymnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymnet -d gymnet"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://gymnet:gymnet@postgres:5432/gymnet
      GYMNET_LIVE_SESSIONS_PATH: /shared_ml/live_sessions.jsonl
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
      GYMNET_ONLINE_PROFILE_PATH: /shared_ml/online_profile.json
      GYMNET_AUTORETRAIN_SHARED_STATUS_PATH: /shared_ml/auto_retrain_status.json
      GYMNET_SHARED_MODEL_PATH: /shared_ml/best_model.pt
      GYMNET_SHARED_EVAL_PATH: /shared_ml/eval_report.json
      GYMNET_LIVE_ML_INTERVAL_SEC: "2.5"
      GYMNET_DISABLE_LIVE_ML: "false"
      GYMNET_LIVE_TRAIN_MIN_CONFIDENCE: "0.35"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"
    volumes:
      - ml_live_data:/shared_ml

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "8080:80"

  ml-pipeline:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.gpu.txt
    profiles: ["ml"]
    restart: "no"
    volumes:
      - ../ml:/workspace
      - ml_live_data:/shared_ml
    environment:
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
    command: ["python", "run_pipeline.py"]

  ml-notebook:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.notebook.txt
    profiles: ["ml"]
    restart: unless-stopped
    volumes:
      - ../ml:/workspace
      - ml_live_data:/shared_ml
    environment:
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
    ports:
      - "8888:8888"

  ml-train:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.pipeline.txt
    profiles: ["ml"]
    volumes:
      - ../ml:/workspace
      - ml_live_data:/shared_ml
    environment:
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
    command: ["python", "train.py"]

  ml-generate:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.pipeline.txt
    profiles: ["ml"]
    volumes:
      - ../ml:/workspace
      - ml_live_data:/shared_ml
    environment:
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
    command: ["python", "generate_synthetic_dataset.py"]

  ml-eval:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.pipeline.txt
    profiles: ["ml"]
    volumes:
      - ../ml:/workspace
      - ml_live_data:/shared_ml
    environment:
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
    command: ["python", "evaluate.py"]

  ml-autotrain:
    build:
      context: ../ml
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.pipeline.txt
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../ml:/workspace
      - ml_live_data:/shared_ml
    environment:
      GYMNET_LIVE_SESSIONS_PATH: /shared_ml/live_sessions.jsonl
      GYMNET_LIVE_TRAIN_PATH: /shared_ml/live_train.jsonl
      GYMNET_AUTORETRAIN_STATE_PATH: /workspace/experiments/auto_retrain_status.json
      GYMNET_AUTORETRAIN_SHARED_STATUS_PATH: /shared_ml/auto_retrain_status.json
      GYMNET_SHARED_MODEL_PATH: /shared_ml/best_model.pt
      GYMNET_SHARED_EVAL_PATH: /shared_ml/eval_report.json
      GYMNET_AUTORETRAIN_MIN_NEW_SESSIONS: 10
      GYMNET_AUTORETRAIN_MIN_NEW_TRAIN_SAMPLES: 8
      GYMNET_AUTORETRAIN_COOLDOWN_SECONDS: 900
      GYMNET_AUTORETRAIN_POLL_SECONDS: 20
      GYMNET_AUTORETRAIN_MAX_F1_DROP: 0.02
      GYMNET_AUTORETRAIN_MAX_FAIL_STREAK: "5"
      GYMNET_LIVE_MERGE_MAX_SAMPLES: "80"
      GYMNET_LIVE_MERGE_MAX_RATIO: "0.25"
      GYMNET_LIVE_TRAIN_MIN_CONFIDENCE: "0.35"
    command: ["python", "auto_retrain.py"]

volumes:
  postgres_data:
  ml_live_data:
